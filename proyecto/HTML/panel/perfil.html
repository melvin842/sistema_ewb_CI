<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Panel Administrativo</title>

    <link rel="stylesheet" href="../../CSS/panel/sidebar.css">
    <link rel="stylesheet" href="../../CSS/panel/dashboard.css">
    <link rel="stylesheet" href="../../CSS/panel/perfil.css">
    <link rel="stylesheet" href="../../CSS/panel/perfil-menu.css">
    <link rel="stylesheet" href="../CSS/panel/responsive-panel.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>

<div class="dashboard">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-logo">
            <img src="../../img/logo_ci_blanco.png" alt="">
        </div>

        <h3>Menú</h3>

        <nav>

            <a href="../panel/dashboard.html">
                <span class="material-symbols-outlined">home</span>
                Inicio
            </a>

            <a href="../panel/productos.html">
                <span class="material-symbols-outlined">liquor</span>
                Productos
            </a>

            <a href="../panel/recursos-humanos.html">
                <span class="material-symbols-outlined">groups</span>
                Recursos Humanos
            </a>

            <a href="../panel/noticias.html">
                <span class="material-symbols-outlined">campaign</span>
                Noticias
            </a>

            <a href="../panel/sugerencias.html">
                <span class="material-symbols-outlined">markunread_mailbox</span>
                Sugerencias
            </a>

        </nav>

        <div class="logout">
            <a href="#" id="btnLogout">
                <i class="fa-solid fa-right-from-bracket"></i>
                Cerrar Sesión
            </a>
        </div>

    </aside>

    <!-- CONTENIDO -->

    <main class="content">

        <header class="topbar">

            <h1>MI PERFIL</h1>

            <div class="user-menu" id="userMenu">

                <button class="user-btn" id="userBtn" type="button">
                    <i class="fa-solid fa-circle-user"></i>
                </button>

                <div class="user-dropdown" id="userDropdown">

                    <div class="user-dropdown-header">
                        <strong id="userDropdownNombre">Usuario</strong>
                        <span id="userDropdownRol">--</span>
                    </div>

                    <a href="../panel/perfil.html">
                        <i class="fa-solid fa-id-card"></i> Ver Perfil
                    </a>

                    <a href="crear usuario.html" id="linkCrearUsuario" style="display:none;">
                        <i class="fa-solid fa-user-plus"></i> Crear Nuevo Usuario
                    </a>

                </div>

            </div>

        </header>

        <section class="perfil-card">

            <div class="perfil-foto-wrap">
                <img id="fotoPerfil" src="../../img/logo_ci 2.png" alt="Foto de perfil">
                <button type="button" id="btnCambiarFoto" class="btn-camara" title="Cambiar foto">
                    <i class="fa-solid fa-camera"></i>
                </button>
                <input type="file" id="inputFoto" accept="image/*" hidden>
            </div>

            <form id="formPerfil">

                <div class="campo">
                    <label>Nombre completo</label>
                    <div class="campo-valor">
                        <span class="campo-texto" id="valNombreCompleto">--</span>
                        <input type="text" class="campo-input" id="inputNombreCompleto" hidden>
                        <button type="button" class="btn-editar-campo" data-campo="nombreCompleto" title="Editar">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                    </div>
                </div>

                <div class="campo">
                    <label>Correo</label>
                    <div class="campo-valor">
                        <span class="campo-texto" id="valCorreo">--</span>
                        <input type="email" class="campo-input" id="inputCorreo" hidden>
                        <button type="button" class="btn-editar-campo" data-campo="correo" title="Editar">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                    </div>
                </div>

                <div class="campo">
                    <label>Usuario</label>
                    <div class="campo-valor">
                        <span class="campo-texto" id="valNombre">--</span>
                    </div>
                </div>

                <div class="campo">
                    <label>Rol</label>
                    <div class="campo-valor">
                        <span class="campo-texto" id="valRol">--</span>
                    </div>
                </div>

                <div class="campo campo-password" id="campoPassword" hidden>
                    <label>Cambiar contraseña</label>
                    <div class="campo-valor campo-valor-password">
                        <input type="password" id="inputContrasenaActual" placeholder="Contraseña actual">
                        <input type="password" id="inputContrasenaNueva" placeholder="Contraseña nueva">
                    </div>
                </div>

                <p id="mensajePerfil" class="mensaje-perfil"></p>

                <div class="perfil-acciones">
                    <button type="button" id="btnCambiarPassword" class="btn-secundario">
                        <i class="fa-solid fa-key"></i> Cambiar contraseña
                    </button>
                    <button type="submit" id="btnGuardar" class="btn-guardar" hidden>
                        Guardar cambios
                    </button>
                </div>

            </form>

        </section>

    </main>

</div>

<script src="../../JS/panel/control-acceso.js"></script>
<script src="../../JS/panel/alerts.js"></script>
<script src="../../JS/panel/perfil'menu.js"></script>
<script src="../../JS/panel/perfil.js"></script>

</body>
</html>
