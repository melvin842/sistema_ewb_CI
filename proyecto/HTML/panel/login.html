<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Administrativo</title>

<link rel="stylesheet" href="../../CSS/panel/login.css">
<link rel="stylesheet" href="../CSS/panel/responsive-panel.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        media="all">

</head>
<body>

<div class="login-container">

    <div class="login-banner">

        <div class="overlay"></div>

        <img src="../../img/022.png" alt="">

        <div class="banner-content">
            <h2>Calidad industrial que genera confianza</h2>
            <p>Comercializadora El Ingenio</p>
        </div>

    </div>

    <div class="login-form">

        <h1>PANEL ADMINISTRATIVO</h1>

        <img src="../../img/logo_ci.png" alt="Logo" class="logo">

        <form id="loginForm">

            <label>CORREO ELECTRONICO</label>

<div class="input-box">
    <i class="fa-regular fa-envelope"></i>
    <input type="email"
    id="correo"
    placeholder="ESCRIBE TU CORREO ELECTRÓNICO"
    required>
</div>

            <label>CONTRASEÑA</label>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password"
                id="contrasena"
                placeholder="ESCRIBE TU CONTRASEÑA"
                required>
            </div>

            <button type="submit">
                INICIAR SESIÓN
            </button>

        </form>

    </div>

</div>

<script src="../../JS/panel/alerts.js"></script>
<script src="../../JS/panel/login.js"></script>

</body>
</html>
